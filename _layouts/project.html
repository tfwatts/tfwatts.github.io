---
layout: default
---
<article class="project">
  <header class="project-header">
    <p class="project-tags">
      <span class="tag-course">{{ page.course }}</span>
      <span class="tag-method">{{ page.method }}</span>
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="project-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  {% if page.banner %}
  <figure class="project-banner">
    <img src="{{ page.banner | relative_url }}" alt="{{ page.banner_alt }}">
  </figure>
  {% endif %}

  {{ content }}

  <p class="project-back"><a href="{{ '/projects/' | relative_url }}">&larr; Back to Research and Projects</a></p>
</article>
