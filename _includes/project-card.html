{% assign project = include.project %}
<a class="card" href="{{ project.url | relative_url }}" data-course="{{ project.course | slugify }}" data-featured="{{ project.featured | default: false }}">
  {% if project.thumbnail %}
  <img class="card-thumb" src="{{ project.thumbnail | relative_url }}" alt="Map thumbnail for {{ project.title }}">
  {% endif %}
  <div class="card-body">
    <h3>{{ project.title }}</h3>
    <p class="card-tags">
      {% if include.show_featured and project.featured %}
      <span class="tag-featured">Featured</span>
      {% endif %}
      <span class="tag-course">{{ project.course }}</span>
      <span class="tag-method">{{ project.method }}</span>
    </p>
    <p class="card-summary">{{ project.summary }}</p>
  </div>
</a>
