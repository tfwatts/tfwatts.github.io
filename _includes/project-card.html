{% assign project = include.project %}
<a class="card" href="{{ project.url | relative_url }}">
  {% if project.thumbnail %}
  <img class="card-thumb" src="{{ project.thumbnail | relative_url }}" alt="Map thumbnail for {{ project.title }}">
  {% endif %}
  <div class="card-body">
    <h3>{{ project.title }}</h3>
    <p class="card-tags">
      <span class="tag-course">{{ project.course }}</span>
      <span class="tag-method">{{ project.method }}</span>
    </p>
    <p class="card-summary">{{ project.summary }}</p>
  </div>
</a>
